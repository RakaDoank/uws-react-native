name: Code Check

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

jobs:
  code-check:
    name: Code Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Fetch all history so git diff can compare branches accurately
          fetch-depth: 0
  
      - name: Use Bun.js
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript Check
        run: bun run type-check

      - name: Lint Staged
        run: |
          bunx lint-staged --diff="origin/${{ github.base_ref }}...HEAD"
