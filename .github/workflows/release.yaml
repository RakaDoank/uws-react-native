name: Release

on:
  push:
    branches:
      - release

jobs:
  release:
    name: Release Package
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # For GitHub Release
      packages: write # For publishing to the GitHub Packages
      id-token: write
    steps:
      - uses: actions/checkout@v6
  
      - name: Use Bun.js
        uses: oven-sh/setup-bun@v2

      # Currently, we are using `npm` for publishing
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: UWS Mod
        run: |
          bun run package-builder uws-mod

      - name: Release to NPM registry
        run: |
          bun ./scripts/release-npm.mjs

      - name: Publish GitHub Packages and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm config set //npm.pkg.github.com/:_authToken "${{ secrets.GITHUB_TOKEN }}"
          bun ./scripts/release-github.mjs
